async function decrypt(password){for(const name of keys){try{const v=JSON.parse(localStorage.getItem(name)||'null');if(!v||v.version!==1)continue;const m=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64bytes(v.salt),iterations:250000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['decrypt']);const out=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64bytes(v.iv)},k,b64bytes(v.cipher));return new TextDecoder().decode(out)}catch{}}throw Error('저장된 로그인 또는 비밀번호를 확인할 수 없습니다.')}
