name: Sync Bunjang public listings (no Apify)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/bunjang-request.json']
permissions:
  contents: write
concurrency:
  group: all-collector-pages
  cancel-in-progress: false
env:
  BUNJANG_RAW_PATH: bunjang-public-items.json
jobs:
  sync-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate public-record filters
        run: node --test tests/bunjang-public-records.test.mjs
      - name: Install standard public-page browser
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Read public seller page without paid services
        run: node scripts/fetch_bunjang_public.mjs
      - name: Append unseen products with existing preservation rules
        run: python scripts/sync_bunjang.py
      - name: Commit only newly collected products
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- data/bunjang-active.json; then
            echo 'No new products. Existing records unchanged.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/bunjang-active.json
          test "$(git diff --cached --name-only)" = 'data/bunjang-active.json'
          git commit -m 'Append new public Bunjang listings'
          git push origin HEAD:main
